plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.19'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// 发布产物名：hopperfill-<mod_version>-fabric-<artifact_suffix>.jar
// 例：hopperfill-4.0.1-fabric-mc1.21.x.jar。逐版本构建时把 gradle.properties 里的
// artifact_suffix 改成 mc1.21.11 即可得到对应小版本的产物名。
def artifactFileName = "${project.archives_base_name}-${project.mod_version}-fabric-${project.artifact_suffix}.jar"

tasks.matching { it.name == "remapJar" }.configureEach {
    archiveFileName = artifactFileName
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_dependency", project.minecraft_dependency
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_dependency": project.minecraft_dependency
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}