# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# 依赖下载直连（如需代理，请在此处按需补充 systemProp.*.proxyHost/Port）

# Fabric（Yarn 映射）
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3
fabric_version=0.141.6+1.21.11

# Mod
mod_version=4.0.1
maven_group=com.zijlo
archives_base_name=hopperfill
# 产物名后缀，最终 jar = <archives_base_name>-<mod_version>-fabric-<artifact_suffix>.jar
# 通用包用 mc1.21.x；build-121x.sh 逐版本构建时会改成 mc<具体版本>（如 mc1.21.11）
artifact_suffix=mc1.21.x
minecraft_dependency=>=1.21.11 <1.22
