plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// 发布产物名：hopperfill-<mod_version>-fabric-<artifact_suffix>.jar
// 例：hopperfill-4.0.1-fabric-mc26.x.jar。逐版本构建时把 gradle.properties 里的
// artifact_suffix 改成 mc26.1.1 即可得到对应小版本的产物名。
// 注意：26 系列走非混淆的 net.fabricmc.fabric-loom，最终产物由 jar 任务直接产出，没有 remapJar。
def artifactFileName = "${project.archives_base_name}-${project.mod_version}-fabric-${project.artifact_suffix}.jar"

tasks.matching { it.name == "jar" }.configureEach {
    archiveFileName = artifactFileName
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    // Minecraft 26+ 为非混淆环境：minecraft 依赖直接以 Mojang 类名（net.minecraft.*）暴露，无需 mappings。
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_dependency", project.minecraft_dependency
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_dependency": project.minecraft_dependency
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}