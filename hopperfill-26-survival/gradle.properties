# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# 依赖下载直连（如需代理，请在此处按需补充 systemProp.*.proxyHost/Port）

# Fabric (Mojang 官方映射)
minecraft_version=26.1
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.145.1+26.1

# Mod
mod_version=4.0.1
maven_group=com.zijlo
archives_base_name=hopperfill
# 产物名后缀，最终 jar = <archives_base_name>-<mod_version>-fabric-<artifact_suffix>.jar
# 通用包用 mc26.x；build-26x.sh 逐版本构建时会改成 mc<具体版本>（如 mc26.1.1）
artifact_suffix=mc26.x
minecraft_dependency=>=26.1
